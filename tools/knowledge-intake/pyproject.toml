[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "knowledge-intake"
version = "0.1.0"
description = "Bounded independent source intake into ordinary Markdown and assets"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
formats = ["pypdfium2>=5.13,<6", "python-docx>=1.2,<2", "python-pptx>=1.0.2,<2", "openpyxl>=3.1.5,<4", "Pillow>=12.3,<13"]
images = ["Pillow>=12.3,<13"]
test = ["reportlab>=4.4.9,<5"]

[project.scripts]
knowledge-intake = "knowledge_intake.cli:main"
knowledge-feed = "knowledge_intake.feed_sync:main"

[tool.hatch.build.targets.wheel]
packages = ["knowledge_intake"]
